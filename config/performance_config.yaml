# Performance Configuration for Amazon Connect Assessment Tool
# This file contains settings to optimize assessment execution performance
# Only includes parameters that are actually supported by the current implementation

# Parallel Execution Settings (used by ParallelAssessmentEngine)
parallel_execution:
  # Enable parallel processing (recommended for multiple instances)
  enabled: true

  # Maximum number of worker threads
  # Auto-detect: null (recommended - uses CPU count * 2, max 32)
  # Manual: specify number (e.g., 8, 16)
  max_workers: null

  # Number of checks to process in each batch
  # Smaller batches: better progress tracking, more overhead
  # Larger batches: less overhead, coarser progress tracking
  batch_size: 10

  # Enable connection pooling for AWS API calls
  # Reduces connection overhead and improves performance
  enable_connection_pooling: true

# Network Resilience Settings (used by AWSClientFactory)
network_resilience:
  # Maximum number of retry attempts for network operations
  max_retry_attempts: 5

  # Base delay between retries in seconds
  retry_base_delay: 1.0

  # Maximum delay between retries in seconds
  retry_max_delay: 60.0

  # Operation timeout in seconds
  timeout: 300

  # Enable automatic rate limiting for AWS API calls
  enable_rate_limiting: true

# Logging Configuration
logging:
  # Log level for performance tracking
  log_level: 'INFO'

  # Enable detailed performance statistics logging
  log_performance_stats: true

# Example configurations for different scenarios
scenarios:
  # Quick assessment (prioritize speed)
  quick:
    max_workers: 16
    batch_size: 20
    timeout: 180

  # Comprehensive assessment (prioritize thoroughness)
  comprehensive:
    max_workers: 8
    batch_size: 5
    timeout: 600
    max_retry_attempts: 3

  # CI/CD pipeline (balanced)
  cicd:
    max_workers: 12
    batch_size: 15
    timeout: 300
    max_retry_attempts: 2
