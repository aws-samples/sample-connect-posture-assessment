project_name: amazon-connect-assessment
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: "archive/"
      reason: "Archive data only"
  # Findings to suppress based on rule ID, file path, and line numbers
  suppressions:
    - rule_id: "SECRET-BASE64-HIGH-ENTROPY-STRING"
      path: "tests/test_property_credential_handling.py"
      reason: "False positive from documented AWS example credential strings used only in property tests; values are not real credentials."
    - rule_id: "SECRET-AWS-ACCESS-KEY"
      path: "tests/test_property_credential_handling.py"
      reason: "False positive from documented AWS example access key and secret key strings used only in property tests; values are not real credentials."
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "tests/test_property_credential_handling.py"
      reason: "False positive from test environment variable name AWS_SECRET_ACCESS_KEY and documented AWS example secret key; values are not real credentials."
    - rule_id: "B608"
      path: "amazon_connect_assessment/checks/security_checks.py"
      reason: "False positive: this builds markdown for a Finding description, not a SQL query or database call."
    - rule_id: "generic.html-templates.security.var-in-script-tag"
      path: "amazon_connect_assessment/templates/html/assessment_report.html"
      reason: "False positive: `embedded_js` is the static, developer-authored report-controller.js read verbatim off disk by _load_external_js(), not assessment data — no attacker-influenced input reaches this block. Dynamic data is emitted into <script type=application/json> islands with `</` escaped, then JSON.parse'd, never executed as script."
    - rule_id: "html.security.audit.insecure-document-method"
      path: "amazon_connect_assessment/templates/html/assessment_report.html"
      reason: "False positive: no unsanitized data reaches a DOM write sink. The journey panel is built via setSanitizedHtml(), which parses markup inertly with DOMParser and rebuilds it through a tag/attribute allowlist (drops script tags, event-handler attributes, unknown elements) before appendChild — no raw innerHTML assignment remains. The only other match is a `document.documentElement.outerHTML` read used to download the report (a read, not a sink)."
    - rule_id: "B108"
      path: "tests/test_engine.py"
      reason: "Test-only literal /tmp paths used for checkpoint path behavior; no production temp-file handling is involved."
    - rule_id: "B108"
      path: "tests/test_engine_extended.py"
      reason: "Test-only literal /tmp path used to verify missing-checkpoint behavior; no production temp-file handling is involved."
    - rule_id: "B108"
      path: "tests/test_cli_extended.py"
      reason: "Test-only literal /tmp path used to verify missing-checkpoint behavior; no production temp-file handling is involved."
    - rule_id: "B506"
      path: "tests/test_iam_policy_consistency.py"
      reason: "Test-only CloudFormation template parsing uses yaml.load with SafeLoader plus intrinsic constructors; unsafe default loading is not used."
    - rule_id: "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag"
      path: ".github/workflows/ash-full-repository-scan.yml"
      reason: "Accepted risk for existing GitHub Actions version tags in this workflow; action versions are maintained through workflow dependency review rather than full SHA pinning."
    - rule_id: "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag"
      path: ".github/workflows/ash-security-scan.yml"
      reason: "Accepted risk for existing GitHub Actions version tags in this workflow; action versions are maintained through workflow dependency review rather than full SHA pinning."
    - rule_id: "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag"
      path: ".github/workflows/cfn-lint.yml"
      reason: "Accepted risk for existing GitHub Actions version tags in this workflow; action versions are maintained through workflow dependency review rather than full SHA pinning."
    - rule_id: "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag"
      path: ".github/workflows/ci.yml"
      reason: "Accepted risk for existing GitHub Actions version tags in this workflow; action versions are maintained through workflow dependency review rather than full SHA pinning."
    - rule_id: "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag"
      path: ".github/workflows/label.yml"
      reason: "Accepted risk for existing GitHub Actions version tags in this workflow; action versions are maintained through workflow dependency review rather than full SHA pinning."

# Whether to fail with non-zero exit code if actionable findings are found
fail_on_findings: true
